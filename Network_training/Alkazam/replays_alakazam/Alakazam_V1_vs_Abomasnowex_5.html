window.kaggle.renderer = function renderer(context) {
  const step = context.step
  const visList = context.environment.steps[0][0].visualize
  const energyText = "CGRWLPFDM A"

  const info = context.environment.info
  const players = [
    info?.TeamNames?.[0] || "Player 0",
    info?.TeamNames?.[1] || "Player 1"
  ]

  let canvas = context.parent.querySelector("canvas")
  if (!canvas) {
    container = document.createElement("div")
    container.style.position = "relative"
    context.parent.appendChild(container)

    canvas = document.createElement("canvas")
    canvas.width = 750
    canvas.height = 700
    container.appendChild(canvas)

    if (visList) {
      for (let k = 0; k < 2; k++) {
        const button = document.createElement("button")
        button.style.width = "130px"
        button.style.height = "50px"
        button.style.left = k == 0 ? "230px" : "380px"
        button.style.top = "55px"
        button.style.position = "absolute"
        button.style.zIndex = 1
        button.innerHTML = "Open Visualizer<br>" + players[k]
        button.addEventListener("click", (e) => {
          for (let i = 0; i < visList.length; i++) {
            for (let j = 0; j < 2; j++) {
              visList[i].current.players[j].ramainingTime = context.environment.steps[i][j].observation.remainingOverageTime
            }
          }
          visList[0].ps = players

          const input = document.createElement("input")
          input.type = "hidden"
          input.name = "json"
          input.value = JSON.stringify(visList)

          const form = document.createElement("form")
          form.method = "POST"
          form.action = "https://ptcgvis.heroz.jp/Visualizer/Replay/"
          if (info.EpisodeId == null) {
            form.action += k
          } else {
            form.action += info.EpisodeId + "/" + k
          }
          form.target = "_blank"
          form.appendChild(input)

          document.body.appendChild(form)
          form.submit()
        })
        container.appendChild(button)
      }
    } else {
      const ctx = canvas.getContext("2d")
      ctx.strokeStyle = "#ccc"
      ctx.fillStyle = "#fff"
      ctx.font = "30px sans-serif"
      ctx.fillText("No visualize data.", 10, 100)
      const error = context.environment.steps[0][0].error
      if (error) {
        ctx.fillText(error, 10, 150)
      }
    }
  }

  if (visList.length <= step) {
    return
  }
  const vis = visList[step]
  const state = vis.current

  const ctx = canvas.getContext("2d")
  ctx.clearRect(0, 0, canvas.width, canvas.height)

  ctx.strokeStyle = "#ccc"
  ctx.fillStyle = "#fff"
  ctx.lineWidth = 2

  ctx.font = "20px sans-serif"
  if (state.result >= 0) {
    if (state.result == 2) {
      ctx.fillText("Draw", 330, 125)
    } else {
      ctx.fillText(players[state.result] + " Win", 290, 140)
    }
  }

  ctx.font = "12px sans-serif"

  const drawCard = (x, y, card) => {
    ctx.beginPath()
    ctx.rect(x, y, 80, 60)
    ctx.stroke()
    nm = card.name
    nm2 = null
    if (nm.length >= 13) {
      for (let i = 0; i < nm.length; i++) {
        if (nm[i] == " ") {
          nm2 = nm.substring(i + 1)
          nm = nm.substring(0, i)
          break
        }
      }
    }
    ctx.fillText(nm, x + 5, y + 13)
    if (nm2 != null) {
      ctx.fillText(nm2, x + 5, y + 27)
    }
  }
  const drawField = (x, y, card) => {
    drawCard(x, y, card)
    ctx.fillText("HP " + card.hp, x + 5, y + 41)
    energy = ""
    for (let e of card.energies) {
      energy = energy + energyText[e]
    }
    ctx.fillText(energy, x + 5, y + 55)
  }
  const posY = (index, len) => {
    const center = 290
    let height
    if (len <= 8) {
      height = 35 * len
    } else {
      height = 280
    }
    return center + height * (2 * index + 1 - len) / len
  }

  for (let j = 0; j < state.stadium.length; j++) {
    drawCard(330, 420, state.stadium[j])
  }

  for (let i = 0; i < 2; i++) {
    const ps = state.players[i]

    ctx.fillText("Active", i == 0 ? 245 : 425, 270)
    ctx.fillText("Bench", i == 0 ? 145 : 525, 10)
    ctx.fillText("Hand", i == 0 ? 15 : 655, 10)
    ctx.fillText("Deck " + ps.deckCount, i == 0 ? 258 : 438, 165)
    ctx.fillText("Discard " + ps.discard.length, i == 0 ? 245 : 425, 185)
    ctx.fillText("Prize " + ps.prize.length, i == 0 ? 258 : 438, 220)

    for (let j = 0; j < ps.active.length; j++) {
      drawField(i == 0 ? 240 : 420, posY(j, ps.active.length), ps.active[j])
    }
    for (let j = 0; j < ps.bench.length; j++) {
      drawField(i == 0 ? 140 : 520, posY(j, ps.bench.length), ps.bench[j])
    }
    for (let j = 0; j < ps.hand.length; j++) {
      drawCard(i == 0 ? 10 : 650, posY(j, ps.hand.length), ps.hand[j])
    }
  }
};

      const App = () => {
        const renderCountRef = useRef(0);
        const [_, setRenderCount] = useState(0);

        // These are bindings to the 0-9 keys and are milliseconds of timeout per step

          333, // Default

          100,

        const contextRef = useRef({
          animate: false,

          debug: false,

          header: window.innerHeight >= 600,
          height: window.innerHeight,
          interactive: false,
          legend: true,
          loading: false,
          playing: false,
          processing: false,
          renderer: () => "DNE",
          settings: false,
          speed: speeds[4],
          step: 0,
          width: window.innerWidth,
        });

        // Context helpers.
        const rerender = (contextRef.current.rerender = () =>
          setRenderCount((renderCountRef.current += 1)));
        const setStep = (contextRef.current.setStep = (newStep) => {
          contextRef.current.step = newStep;
          rerender();
        });
        const setPlaying = (contextRef.current.setPlaying = (playing) => {
          contextRef.current.playing = playing;
          rerender();
        });
        const pause = (contextRef.current.pause = () => setPlaying(false));

        const playNext = () => {
          const context = contextRef.current;

          if (
            context.playing &&
            context.step < context.environment.steps.length - 1
          ) {
            setStep(context.step + 1);
            play(true);
          } else {
            pause();
          }
        };

        const play = (contextRef.current.play = (continuing) => {
          const context = contextRef.current;
          if (context.playing && !continuing) return;
          if (!context.playing) setPlaying(true);
          if (
            !continuing &&
            context.step === context.environment.steps.length - 1
          ) {
            setStep(0);
          }
          setTimeout(playNext, context.speed);
        });

        // Use useState to hold the functions that components will use.
        // We initialize them with the original functions.
        const [playFn, setPlayFn] = useState(() => contextRef.current.play);
        const [pauseFn, setPauseFn] = useState(() => contextRef.current.pause);
        const [stepFn, setStepFn] = useState(() => contextRef.current.setStep);
        const [playingFn, setPlayingFn] = useState(() => contextRef.current.setPlaying);

        const updateContext = (o) => {
          const context = contextRef.current;
          Object.assign(context, o, {
            environment: { ...context.environment, ...(o.environment || {}) },
          });
          rerender();
        };

        contextRef.current.setPlay = setPlayFn;
        contextRef.current.setPause = setPauseFn;
        contextRef.current.setSetStep = setStepFn;
        contextRef.current.setSetPlaying = setPlayingFn;

        // First time setup.
        useEffect(() => {
          // Timeout is used to ensure useEffect renders once.
          setTimeout(() => {
            // Initialize context with window.kaggle.
            updateContext(window.kaggle || {});

            if (window.kaggle?.playing) {
              play(true);
            }

            // Listen for messages received to update the context.
            window.addEventListener(
              "message",
              (event) => {
                // Ensure the environment names match before updating.
                try {
                  if (
                    event.data.environment?.name ==
                      contextRef.current.environment.name ||
                    (event.data.environment?.name &&
                      !contextRef.current.environment.name) ||
                    event.data.environment?.loading !==
                      contextRef.current.environment.loading
                  ) {
                    const nextContext = {
                      ...event.data,
                      environment: {
                        ...event.data.environment,
                        steps: event.data.environment?.steps ?? [],
                      },
                    };
                    if (
                      !nextContext.renderer ||
                      typeof nextContext.renderer !== "function"
                    ) {
                      nextContext.renderer = contextRef.current.renderer;
                    }
                    window.kaggle = nextContext;
                    updateContext(nextContext);
                  }
                  if (event.data.setSteps) {
                    const nextContext = {
                      ...(window.kaggle ?? {}),
                      environment: {
                        ...(window.kaggle?.environment ?? {}),
                        steps: event.data.setSteps,
                      },
                    };
                    if (
                      !nextContext.renderer ||
                      typeof nextContext.renderer !== "function"
                    ) {
                      nextContext.renderer = contextRef.current.renderer;
                    }

                    window.kaggle = nextContext;
                    updateContext(nextContext);
                  }

                  // Side load the renderer script if it is specified by the post message event and not already loaded.
                  const renderScriptId = "rendererScript";
                  if (
                    event.data.environment?.rendererUrl &&
                    !document.querySelector(`#${renderScriptId}`)
                  ) {
                    window.rendererUrl = event.data.environment?.rendererUrl;
                    const script = document.createElement("script");
                    script.id = renderScriptId;
                    script.onload = () => {
                      window.kaggle.renderer = window.renderer;
                    };
                    script.src = window.rendererUrl;
                    document.body.appendChild(script);

                } catch {}
              },

            // Listen for keyboard commands.
            window.addEventListener(
              "keydown",
              (event) => {
                const {
                  interactive,
                  isInteractive,
                  playing,
                  step,
                  environment,
                } = contextRef.current;
                const key = event.keyCode;
                const zero_key = 48;
                const nine_key = 57;
                if (
                  interactive ||
                  isInteractive() ||
                  (key !== 32 &&
                    key !== 37 &&
                    key !== 39 &&
                    !(key >= zero_key && key <= nine_key))
                )
                  return;

                if (key === 32) {
                  playing ? pause() : play();
                } else if (key === 39) {
                  contextRef.current.playing = false;
                  if (step < environment.steps.length - 1) setStep(step + 1);
                  rerender();
                } else if (key === 37) {
                  contextRef.current.playing = false;
                  if (step > 0) setStep(step - 1);
                  rerender();
                } else if (key >= zero_key && key <= nine_key) {
                  contextRef.current.speed = speeds[key - zero_key];
                }
                event.preventDefault();
                return false;
              },
              false,
            );
          }, 1);
        }, []);

        if (contextRef.current.debug) {
          console.log("context", contextRef.current);
        }

        // Ability to update context.
        contextRef.current.update = updateContext;

        // Ability to communicate with ipython.
        const execute = (contextRef.current.execute = (source) =>
          new Promise((resolve, reject) => {
            try {
              window.parent.IPython.notebook.kernel.execute(source, {
                iopub: {
                  output: (resp) => {
                    const type = resp.msg_type;
                    if (type === "stream") return resolve(resp.content.text);
                    if (type === "error") return reject(new Error(resp.evalue));
                    return reject(new Error("Unknown message type: " + type));
                  },
                },
              });
            } catch (e) {
              reject(new Error("IPython Unavailable: " + e));
            }
          }));

        // Ability to return an action from an interactive session.
        contextRef.current.act = (action) => {
          const id = contextRef.current.environment.id;
          updateContext({ processing: true });
          execute(`
            import json
            from kaggle_environments import interactives
            if "${id}" in interactives:
                action = json.loads('${JSON.stringify(action)}')
                env, trainer = interactives["${id}"]
                trainer.step(action)
                print(json.dumps(env.steps))`)
            .then((resp) => {
              try {
                updateContext({
                  processing: false,
                  environment: { steps: JSON.parse(resp) },
                });
                play();
              } catch (e) {
                updateContext({ processing: resp.split("\n")[0] });
                console.error(resp, e);
              }
            })
            .catch((e) => console.error(e));
        };

        // Check if currently interactive.
        contextRef.current.isInteractive = () => {
          const context = contextRef.current;
          const steps = context.environment.steps;
          return (
            context.interactive &&
            !context.processing &&
            context.step === steps.length - 1 &&
            steps[context.step].some((s) => s.status === "ACTIVE")
          );
        };

        // Create a new value object on every render.
        // This object includes the *current* play/pause functions from useState.
        const providerValue = { ...contextRef.current, play: playFn, pause: pauseFn, setStep: stepFn, setPlaying: playingFn };

        return h`
          <${Context.Provider} value=${providerValue}>
            <${Player} className="${contextRef.current.environment.viewer ? "no-border" : ""}" />
          <//>`;
      };

      preact.render(h`<${App} />`, document.body);
    </script>
  </body>
</html>
